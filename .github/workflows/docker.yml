name: Image qbit-booster-mediainfo

on:
  push:
    branches: [main]
    paths: ["mediainfo-api/**", ".github/workflows/docker.yml"]
    tags: ["v*"]
  schedule:
    - cron: "17 4 * * *"   # vérification quotidienne : ne reconstruit que si Python/Alpine/mediainfo ont changé
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.fp.outputs.build }}
      fp: ${{ steps.fp.outputs.fp }}
      image: ${{ steps.fp.outputs.image }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: fp
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/qbit-booster-mediainfo"
          BASE=$(docker buildx imagetools inspect python:3.12-alpine | awk '/^Digest:/{print $2}')
          MI=$(docker run --rm python:3.12-alpine sh -c 'apk update -q >/dev/null && apk search -x mediainfo')
          FP=$(printf '%s %s' "$BASE" "$MI" | sha256sum | cut -c1-12)
          echo "Base : $BASE / $MI -> empreinte $FP"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "fp=$FP" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && docker buildx imagetools inspect "$IMAGE:base-$FP" >/dev/null 2>&1; then
            echo "Rien de neuf : pas de reconstruction."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.check.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=base-${{ needs.check.outputs.fp }}
            type=semver,pattern={{version}}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: ./mediainfo-api
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
